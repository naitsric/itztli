<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Itztli app icon. macOS grid: 824×824 body at (100,100), corner radius 185.
    A knapped obsidian blade on jade, with a text caret. Rendered by
    scripts/render-icon.mjs.
  -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d3ae"/>
      <stop offset="1" stop-color="#0c6b68"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="caret" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc94d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <clipPath id="blade">
      <path d="M0 -330 C112 -214 150 -70 138 60 C128 168 74 262 0 322 C-74 262 -128 168 -138 60 C-150 -70 -112 -214 0 -330 Z"/>
    </clipPath>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#04302e" flood-opacity="0.34"/>
    </filter>
    <filter id="lift" x="-30%" y="-20%" width="160%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#02201f" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>

  <!-- The blade: facets on both sides of a ridge. -->
  <g filter="url(#lift)">
    <g transform="translate(452 516) rotate(24)">
      <g clip-path="url(#blade)">
        <rect x="-170" y="-340" width="340" height="680" fill="#10151c"/>
        <path d="M0 -330 L-18 -120 L-150 -150 L-120 -260 Z" fill="#3b4856"/>
        <path d="M-18 -120 L-150 -150 L-160 20 L-30 70 Z" fill="#232d38"/>
        <path d="M-30 70 L-160 20 L-140 190 L-16 210 Z" fill="#313d4a"/>
        <path d="M-16 210 L-140 190 L-60 330 L0 322 Z" fill="#1b232d"/>
        <path d="M0 -330 L-18 -120 L140 -90 L120 -260 Z" fill="#0f141b"/>
        <path d="M-18 -120 L140 -90 L160 60 L-30 70 Z" fill="#1c2530"/>
        <path d="M-30 70 L160 60 L130 200 L-16 210 Z" fill="#0c1117"/>
        <path d="M-16 210 L130 200 L60 330 L0 322 Z" fill="#171f28"/>
        <path d="M0 -330 L-18 -120 L-84 -135 Z" fill="#7b8c9c" fill-opacity="0.75"/>
        <path d="M-30 70 L-95 45 L-84 120 Z" fill="#62727f" fill-opacity="0.6"/>
        <path d="M0 -330 L-18 -120 L-30 70 L-16 210 L0 322" fill="none" stroke="#9fb2c0" stroke-opacity="0.55" stroke-width="5" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- Text caret: what it cuts into is text. -->
  <g filter="url(#lift)">
    <rect x="716" y="448" width="52" height="300" rx="26" fill="url(#caret)"/>
  </g>
</svg>
