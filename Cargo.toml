[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/naitsric/itztli"

[workspace.dependencies]
itztli-backend = { path = "crates/itztli-backend" }
itztli-core = { path = "crates/itztli-core" }
itztli-history = { path = "crates/itztli-history" }
itztli-index = { path = "crates/itztli-index" }
itztli-plugins = { path = "crates/itztli-plugins" }
itztli-vault = { path = "crates/itztli-vault" }

axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
getrandom = "0.3"
memchr = "2"
notify = "8"
nucleo-matcher = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
rayon = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
trash = "5"
unicode-normalization = "0.1"
walkdir = "2"

# Profiles only take effect at the workspace root.
# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The parser and the search run on whole vaults; unoptimized they make the
# dev build feel nothing like the app.
[profile.dev.package."*"]
opt-level = 2
